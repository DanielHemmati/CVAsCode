minimum_pre_commit_version: "4.6.2"

repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
        args:
          - --hook-config=--tf-path=terraform
          - --hook-config=--tool-version=1.16.1

      - id: terraform_docs
        files: ^terraform/modules/.*\.tf$
        args:
          - --hook-config=--tool-version=0.24.0
          - --hook-config=--create-file-if-not-exist=true
          - --hook-config=--add-to-existing-file=true
          - --args=--config=__GIT_WORKING_DIR__/.terraform-docs.yaml
