<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page not found</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: #f7f6f2;
      color: #000;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .code {
      margin: 0;
      display: grid;
      grid-template-columns: repeat(3, auto);
      grid-template-rows: auto auto;
      font-size: clamp(7rem, 22vw, 18rem);
      font-weight: 500;
      line-height: 0.8;
      letter-spacing: -0.02em;
    }

    .code span:nth-child(1) { grid-column: 1; grid-row: 1; }
    .code span:nth-child(2) { grid-column: 2; grid-row: 2; }
    .code span:nth-child(3) { grid-column: 3; grid-row: 1; }

    .back {
      margin-top: 1.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: inherit;
      text-decoration: none;
    }

    .back:hover,
    .back:focus-visible { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1 class="code" aria-label="404 — Page not found">
      <span aria-hidden="true">4</span>
      <span aria-hidden="true">0</span>
      <span aria-hidden="true">4</span>
    </h1>
    <a class="back" href="/" onclick="if (history.length > 1) { history.back(); return false; }">Go back</a>
  </main>
</body>
</html>
