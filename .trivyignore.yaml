misconfigurations:
  - id: AVD-AWS-0011
    paths:
      - "**/static-site/main.tf"
    statement: AWS WAF is intentionally omitted from this temporary static resume site to avoid unnecessary cost and complexity.

  - id: AVD-AWS-0089
    paths:
      - "**/static-site/main.tf"
    statement: S3 access logging is intentionally omitted because direct bucket access is restricted to CloudFront OAC.

  - id: AVD-AWS-0132
    paths:
      - "**/static-site/main.tf"
    statement: Public website assets intentionally use cost-free SSE-S3 encryption instead of a customer-managed KMS key.

  - id: AVD-AWS-0132
    paths:
      - "**/globals/s3-backend/main.tf"
    statement: This temporary Terraform state backend intentionally uses SSE-S3 to avoid the operational complexity of a customer-managed KMS key.

  - id: AVD-AWS-0132
    paths:
      - "**/globals/plan-artifacts/main.tf"
    statement: Private Terraform plan files use SSE-S3 because a customer-managed KMS key is not required for this project.

  - id: AVD-AWS-0089
    paths:
      - "**/cloudfront-logging/main.tf"
    statement: This bucket stores CloudFront access logs, so separate S3 access logging is not required.

  - id: AVD-AWS-0132
    paths:
      - "**/cloudfront-logging/main.tf"
    statement: CloudFront access logs use the approved SSE-S3 encryption instead of a customer-managed KMS key.

  - id: AVD-AWS-0089
    paths:
      - "**/cloudfront-logging/athena-results.tf"
    statement: This private results bucket omits S3 access logging to avoid a second log pipeline for temporary query output.

  - id: AVD-AWS-0132
    paths:
      - "**/cloudfront-logging/athena-results.tf"
    statement: Athena query results use the approved SSE-S3 encryption instead of a customer-managed KMS key.
