# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Terraform module checks

on:
  pull_request:
    paths:
      - "terraform/modules/**"
      - ".tflint.hcl"
      - ".github/workflows/tf-module-check.yaml"

  push:
    branches:
      - main
    paths:
      - "terraform/modules/**"
      - ".tflint.hcl"
      - ".github/workflows/tf-module-check.yaml"

  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.16.1"
  TFLINT_VERSION: "v0.64.0"

jobs:
  check-modules:
    name: Check Terraform modules
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
          checksums: |
            cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
          cache: true
          tflint_config_path: .tflint.hcl

      - name: Initialize TFLint plugins
        run: tflint --config="${GITHUB_WORKSPACE}/.tflint.hcl" --init

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive -diff terraform/modules

      - name: Initialize and validate modules
        shell: bash
        run: |
          set -euo pipefail

          module_count=0

          while IFS= read -r versions_file; do
            module_directory="${versions_file%/versions.tf}"
            module_count=$((module_count + 1))

            echo "::group::${module_directory}"

            terraform -chdir="${module_directory}" init \
              -backend=false \
              -input=false \
              -lockfile=readonly

            terraform -chdir="${module_directory}" validate -no-color

            echo "::endgroup::"
          done < <(git ls-files "terraform/modules/**/versions.tf")

          if [[ "${module_count}" -eq 0 ]]; then
            echo "No Terraform modules were found." >&2
            exit 1
          fi

      - name: Lint Terraform modules
        run: |
          tflint \
            --chdir=terraform/modules \
            --recursive \
            --config="${GITHUB_WORKSPACE}/.tflint.hcl" \
            --format=compact \
            --minimum-failure-severity=warning

      - name: Scan modules with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          skip-dirs: terraform/live # b/c i want to see the path like `modules/globals/s3-backend/main.tf`
          version: v0.70.0
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
