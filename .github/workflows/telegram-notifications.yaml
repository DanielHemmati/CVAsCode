# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Telegram notifications

on:
  workflow_run:
    workflows:
      - Test AWS OIDC
      - Show GitHub workspace
      - Terraform module checks
      - Terraform live deployment
      - Deploy Resume Site
    types:
      - completed

permissions: {}

jobs:
  notify:
    name: Send Telegram notification
    if: >-
      !contains(fromJSON('["skipped", "neutral"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read # read the job list of the finished run

    steps:
      - name: Send workflow result to Telegram
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RESULT: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_ACTOR: ${{ github.event.workflow_run.actor.login }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets are required."
            exit 1
          fi

          max_job_lines=15
          max_commit_length=120

          # Values are used in text and inside href="...", so escape quotes too.
          # Replacements are quoted: in bash 5.2+ an unquoted & means "the matched text".
          escape_html() {
            local escaped="${1}"
            escaped="${escaped//&/'&amp;'}"
            escaped="${escaped//</'&lt;'}"
            escaped="${escaped//>/'&gt;'}"
            escaped="${escaped//\"/'&quot;'}"
            printf '%s' "${escaped}"
          }

          conclusion_emoji() {
            case "${1}" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              cancelled) printf '⚪' ;;
              timed_out) printf '⏱️' ;;
              skipped) printf '⏭️' ;;
              *) printf '⚠️' ;;
            esac
          }

          format_duration() {
            local seconds="${1}"
            if (( seconds >= 3600 )); then
              printf '%dh %dm' $(( seconds / 3600 )) $(( seconds % 3600 / 60 ))
            elif (( seconds >= 60 )); then
              printf '%dm %ds' $(( seconds / 60 )) $(( seconds % 60 ))
            else
              printf '%ds' "${seconds}"
            fi
          }

          repository_html="$(escape_html "${REPOSITORY}")"
          repository_url="${SERVER_URL}/${REPOSITORY}"

          # Header: result and workflow.
          status_emoji="$(conclusion_emoji "${WORKFLOW_RESULT}")"
          header="${status_emoji} <b>$(escape_html "${WORKFLOW_NAME}")</b> — $(escape_html "${WORKFLOW_RESULT}")"

          # Meta line: where, how, which run, how long.
          meta="${repository_html##*/} · $(escape_html "${WORKFLOW_BRANCH}") · $(escape_html "${WORKFLOW_EVENT}") · #${RUN_NUMBER}"
          if (( RUN_ATTEMPT > 1 )); then
            meta+=" (attempt ${RUN_ATTEMPT})"
          fi
          if started_epoch="$(date -d "${RUN_STARTED_AT}" +%s 2>/dev/null)" \
            && updated_epoch="$(date -d "${RUN_UPDATED_AT}" +%s 2>/dev/null)" \
            && (( updated_epoch >= started_epoch )); then
            meta+=" · $(format_duration $(( updated_epoch - started_epoch )))"
          fi
          meta+=" · by $(escape_html "${WORKFLOW_ACTOR}")"

          # Commit line: short SHA link and first line of the message.
          commit_url="${repository_url}/commit/${HEAD_SHA}"
          commit_subject="${COMMIT_MESSAGE%%$'\n'*}"
          if (( ${#commit_subject} > max_commit_length )); then
            commit_subject="${commit_subject:0:max_commit_length}…"
          fi
          commit_line="<a href=\"$(escape_html "${commit_url}")\"><code>${HEAD_SHA:0:7}</code></a>"
          if [[ -n "${commit_subject}" ]]; then
            commit_line+=" $(escape_html "${commit_subject}")"
          fi

          # Jobs: one line per job, with the failed step and a job link on failure.
          job_lines=()
          job_count=0
          if jobs_data="$(gh api \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[] | [
              (.conclusion // "unknown"),
              .name,
              ((.steps // []) | map(select(.conclusion == "failure")) | first | .name // ""),
              .html_url
            ] | join("\u001f")' 2>/dev/null)"; then
            while IFS=$'\x1f' read -r job_conclusion job_name failed_step job_url; do
              [[ -n "${job_name}" ]] || continue
              job_count=$(( job_count + 1 ))
              (( job_count <= max_job_lines )) || continue

              job_line="$(conclusion_emoji "${job_conclusion}") $(escape_html "${job_name}")"
              if [[ "${job_conclusion}" != "success" && "${job_conclusion}" != "skipped" ]]; then
                if [[ -n "${failed_step}" ]]; then
                  job_line+=" → $(escape_html "${failed_step}")"
                fi
                job_line+=" (<a href=\"$(escape_html "${job_url}")\">logs</a>)"
              fi
              job_lines+=("${job_line}")
            done <<<"${jobs_data}"

            if (( job_count > max_job_lines )); then
              job_lines+=("…and $(( job_count - max_job_lines )) more")
            fi
          else
            echo "::warning::Could not read the job list. Sending the message without job details."
          fi

          # Website: only runs that upload a deployment-info artifact (Deploy Resume Site) have one.
          site_line=""
          deployment_dir="${RUNNER_TEMP}/deployment-info"
          if gh run download "${RUN_ID}" \
            --repo "${REPOSITORY}" \
            --name deployment-info \
            --dir "${deployment_dir}" >/dev/null 2>&1; then
            website_url="$(head -n 1 "${deployment_dir}/website-url.txt" 2>/dev/null || true)"
            if [[ "${website_url}" =~ ^https://[a-z0-9.-]+\.cloudfront\.net/?$ ]]; then
              website_url_html="$(escape_html "${website_url}")"
              site_line="🌐 <a href=\"${website_url_html}\">${website_url_html}</a>"
            else
              echo "::warning::deployment-info artifact has no valid CloudFront URL. Sending the message without it."
            fi
          fi

          # Links row.
          links="<a href=\"$(escape_html "${WORKFLOW_URL}")\">Run</a> · <a href=\"$(escape_html "${commit_url}")\">Commit</a>"
          if [[ -n "${PR_NUMBER}" ]]; then
            links+=" · <a href=\"$(escape_html "${repository_url}/pull/${PR_NUMBER}")\">PR #${PR_NUMBER}</a>"
          fi

          lines=("${header}" "${meta}" "" "${commit_line}")
          if [[ -n "${site_line}" ]]; then
            lines+=("${site_line}")
          fi
          if (( ${#job_lines[@]} > 0 )); then
            lines+=("" "<b>Jobs</b>" "${job_lines[@]}")
          fi
          lines+=("" "${links}")
          message="$(printf '%s\n' "${lines[@]}")"

          # Successes arrive silently; everything else makes a sound.
          if [[ "${WORKFLOW_RESULT}" == "success" ]]; then
            disable_notification=true
          else
            disable_notification=false
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "disable_notification=${disable_notification}"
