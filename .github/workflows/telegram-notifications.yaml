# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Telegram notifications

on:
  workflow_run:
    workflows:
      - Test AWS OIDC
      - Show GitHub workspace
      - Terraform module checks
    types:
      - completed

permissions: {}

jobs:
  notify:
    name: Send Telegram notification
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Send workflow result to Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RESULT: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_ACTOR: ${{ github.event.workflow_run.actor.login }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets are required."
            exit 1
          fi

          message="$(printf 'GitHub Actions: %s\nWorkflow: %s\nRepository: %s\nBranch: %s\nEvent: %s\nActor: %s\nRun: %s' \
            "${WORKFLOW_RESULT}" \
            "${WORKFLOW_NAME}" \
            "${REPOSITORY}" \
            "${WORKFLOW_BRANCH}" \
            "${WORKFLOW_EVENT}" \
            "${WORKFLOW_ACTOR}" \
            "${WORKFLOW_URL}")"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "disable_web_page_preview=true"
