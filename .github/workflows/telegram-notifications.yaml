# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Telegram notifications

on:
  workflow_run:
    workflows:
      - Test AWS OIDC
      - Show GitHub workspace
      - Terraform module checks
    types:
      - completed

permissions: {}

jobs:
  notify:
    name: Send Telegram notification
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Send workflow result to Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RESULT: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_ACTOR: ${{ github.event.workflow_run.actor.login }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets are required."
            exit 1
          fi

          escape_html() {
            local escaped="${1}"
            escaped="${escaped//&/&amp;}"
            escaped="${escaped//</&lt;}"
            escaped="${escaped//>/&gt;}"
            printf '%s' "${escaped}"
          }

          workflow_name_html="$(escape_html "${WORKFLOW_NAME}")"
          workflow_result_html="$(escape_html "${WORKFLOW_RESULT^^}")"
          repository_html="$(escape_html "${REPOSITORY}")"
          branch_html="$(escape_html "${WORKFLOW_BRANCH}")"
          event_html="$(escape_html "${WORKFLOW_EVENT}")"
          actor_html="$(escape_html "${WORKFLOW_ACTOR}")"
          workflow_url_html="$(escape_html "${WORKFLOW_URL}")"

          message="$(printf '<b>GitHub Actions | %s</b>\n\n<b>Workflow</b>\n<code>%s</code>\n\n<b>Repository</b>\n<code>%s</code>\n\n<b>Branch</b>\n<code>%s</code>\n\n<b>Event</b>\n<code>%s</code>\n\n<b>Actor</b>\n<code>%s</code>\n\n<a href="%s">View workflow run</a>' \
            "${workflow_result_html}" \
            "${workflow_name_html}" \
            "${repository_html}" \
            "${branch_html}" \
            "${event_html}" \
            "${actor_html}" \
            "${workflow_url_html}")"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true"
