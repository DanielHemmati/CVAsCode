# Just check if things are working
name: Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-access:
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::814023476338:role/github-actions-cvascode
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity
